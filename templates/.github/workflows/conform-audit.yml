# conformIT adopter workflow scaffold.
#
# Copy into your own repo as .github/workflows/conform-audit.yml and
# fill in the bracketed values. Nothing else needs editing.
#
# What this does: calls conformIT's reusable-audit.yml against your own
# repo, and publishes the full findings to a private reporting repo you
# create and control. conformIT never sees or holds your credential; it
# only runs inside your own job, for the duration of your own run. See
# https://github.com/almadon/conformIT/blob/main/docs/decisions.md #17.
#
# Two ways to use this, both fine:
#   - Reference almadon's copy directly (the `uses:` line below, as
#     written). You get conformIT's standards as-is; upgrading means
#     bumping the pinned tag when you choose to.
#   - Fork almadon/conformIT first, then point `uses:` at your own
#     fork instead (`<your-org>/conformIT/...@<your-tag>`). Do this if
#     you want to adapt the standards themselves, not just run the
#     audit against your own repos: you get your own copy of docs/ to
#     diverge from deliberately, recorded the way conformIT records its
#     own departures from what it was originally derived from.
#
# Before this runs, you need:
#   1. A private reporting repo (this workflow never creates one).
#   2. A fine-grained GitHub PAT scoped to ONLY that repo, with
#      `Contents: Read and write` and nothing else. Least privilege:
#      this token should not be able to touch anything but the one
#      repo it's meant to write reports into.
#   3. That token added as a secret in THIS repo (not conformIT, not
#      anywhere else), named to match what's referenced below.

name: conform audit

on:
  schedule:
    - cron: "0 13 * * 1" # weekly; change to taste
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    # Pinned to a tag, not @main: conformIT's own security-posture.md
    # rule 8 argues against a floating dependency, and that applies to
    # conformIT as a dependency of your workflow just as much as it
    # applies to conformIT's own dependencies. Re-verify and re-pin
    # deliberately when you want the latest version, don't switch to
    # @main to avoid doing that.
    uses: almadon/conformIT/.github/workflows/reusable-audit.yml@v1
    with:
      # One `owner/repo` per line; list more than one to audit several
      # repos in the same run. Leaving `targets` unset does NOT default
      # to auditing this repo: it falls back to conformIT's OWN
      # registry/targets.yaml instead. Set this explicitly.
      targets: |
        - [owner/repo]
      reporting_repo: [owner/reporting-repo-name]
    secrets:
      # Name this whatever you like; it just has to match a real secret
      # in this repo's own settings.
      reporting_token: ${{ secrets.CONFORM_REPORTING_TOKEN }}
