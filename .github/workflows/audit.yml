name: conformIT audit

# Recurring compliance check against the projects declared in
# registry/targets.yaml. Report-only: this workflow never modifies
# conformIT or any audited repo, and never writes anything back to either.
# See docs/decisions.md #12 for why it's scoped to a declared list of
# public repos, and docs/STATE.md for what the checks currently cover.
#
# Output goes to the job summary only, not a commit or an issue. The
# checks print filenames, line numbers, and short labels; never full file
# contents or anything from this runner's own environment, since the
# summary is visible to anyone with read access to this repo.
#
# The job always exits green, even when a target fails every check: this
# is a report, not a gate, matching decision #2 (audit never blocks). Read
# the summary; don't rely on the Actions status badge to notice a finding.

on:
  schedule:
    - cron: "0 13 * * 1" # every Monday, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out conformIT
        # VERIFY: security-posture.md rule 8 asks for a version pinned to
        # a commit SHA, not a floating major-version tag. Not done here:
        # this session had no way to confirm a real, current SHA for this
        # action without network access, and guessing one would be worse
        # than the floating tag it would replace. Pin this properly the
        # next time someone can verify it.
        uses: actions/checkout@v4

      - name: Run the audit against every declared target
        run: |
          set -euo pipefail
          bash scripts/conform.sh audit --all >> "$GITHUB_STEP_SUMMARY"
