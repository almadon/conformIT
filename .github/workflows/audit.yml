name: conformIT audit

# conformIT's own use of its own reusable workflow
# (reusable-audit.yml), auditing conformIT's own registry/targets.yaml
# against conformIT's own private reporting repo. This file is
# deliberately thin: everything that isn't almadon-specific lives in
# reusable-audit.yml instead, so any other org can call the same logic
# with their own targets and their own reporting repo. See
# docs/decisions.md #17.
#
# Called via a same-repo relative path, not a pinned tag: a same-repo
# call always runs the exact commit it's part of, so there's no
# separate "which version" question to pin against the way there is for
# an external caller. Security-posture.md rule 8's pinning argument is
# about a *drifting* dependency; a relative same-repo call can't drift
# from itself.

on:
  schedule:
    - cron: "0 13 * * 1" # every Monday, 13:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  audit:
    uses: ./.github/workflows/reusable-audit.yml
    with:
      reporting_repo: almadon/conformIT-reporting
    secrets:
      reporting_token: ${{ secrets.CONFORMIT_REPORTING_TOKEN }}
