# conformIT audit targets (the public list).
#
# Read by scripts/conform.sh (audit --all) and .github/workflows/audit.yml,
# which parse this as a flat bulleted list under `targets:` with grep and
# sed, not a real YAML parser, since this list has no structure worth one.
# Keep every entry on its own `  - owner/repo` line; changing the file's
# shape means updating the parser in scripts/conform.sh too.
#
# Public GitHub repos only, because this file is read by CI, which has no
# credentials for anything else, and because conformIT is itself public:
# a private repo's name or a private host's address written here would
# disclose exactly what docs/security-posture.md rule 9 says not to
# publish. Private and internal repos (a Forgejo on a private host, private
# GitHub repos) belong in registry/targets.local.yaml instead, which is
# gitignored and run locally with your own credentials. See
# registry/targets.local.example.yaml and docs/decisions.md #23.
#
# Not audited, on purpose: repos kept only to carry a bugfix on top of
# someone else's project (ha-homebox, memoket-ha, openwebui-importer,
# niimprint). The standards are not theirs to meet, and a finding in
# upstream code is not ours to act on.
#
# conformIT audits itself here too, deliberately: it's the one target
# whose exemptions (docs/decisions.md #10) this same audit script already
# knows how to read correctly.

targets:
  - almadon/conformIT
  - almadon/novak
  - almadon/novak-integracije
  - almadon/novak-konzol
  - almadon/Consigliere
  - almadon/consigliere-fleet-template
  - flashctrl/flashDK
  - afterglowfc/anjunatree
  - tmeuze/ha-niimbridge
  - tmeuze/ha-propsense
  - tmeuze/ha-unity
